---
all:
  children:
    hypervisor:
      hosts:
        hypervisor01:

    debian:
      hosts:
        deb[201:202]:
          ansible_host: "192.168.88.{{ inventory_hostname | regex_search('[0-9]+') }}"
          vmid: "{{ inventory_hostname | regex_replace('[^0-9]') | int }}"
          pve_target_host: "hypervisor01"
          vm_ram: 2048
          vm_vcpus: 2
          vm_recreate: true

    rocky:
      hosts:
        roc[211:212]:
          ansible_host: "192.168.88.{{ inventory_hostname | regex_search('[0-9]+') }}"
          vmid: "{{ inventory_hostname | regex_replace('[^0-9]') | int }}"
          pve_target_host: "hypervisor01"
          vm_ram: 2048
          vm_vcpus: 2
          vm_recreate: true

vms:
  children:
    debian:
    rocky:
